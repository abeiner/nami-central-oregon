name: Publish sponsorship app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sponsorship-production
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: python -m pip install --quiet reportlab && python scripts/build-guide.py
      - run: npm ci --prefix web && npm run build --prefix web
      - run: npm ci --omit=dev --prefix api && node scripts/package-api.cjs
      - name: Deploy to the demo site
        uses: Azure/static-web-apps-deploy@v1
        env:
          INPUT_SKIP_API_BUILD: "true"
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: web/dist
          skip_app_build: true
          api_location: .local/function-app
          output_location: ""

